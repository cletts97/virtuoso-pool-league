<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101824" />
    <title>Offline · Virtuoso Pool League</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c121c;
        color: #edf0f5;
        font:
          16px/1.6 'Segoe UI',
          Arial,
          sans-serif;
      }
      main {
        max-width: 430px;
        padding: 32px;
      }
      span {
        color: #ff7938;
        font-weight: 700;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: #a9b5c7;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 22px;
        background: #ff5c00;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>VIRTUOSO POOL LEAGUE</span>
      <h1>You’re offline</h1>
      <p>
        Reconnect to view current fixtures and bookings, sign in, or submit a result. Changes cannot
        be saved offline.
      </p>
      <p>Your account and league data aren’t stored in the offline cache.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
